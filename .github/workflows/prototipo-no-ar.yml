# O PROTÓTIPO NO AR, NUM ENDEREÇO FIXO (pedido de 05/11, para a reunião no Pão).
#
# Cada vez que o protótipo muda neste branch, ele vai para o GitHub Pages:
#   https://kanaitzin.github.io/fundacao/
# sempre na última versão, sem login, com os dados fictícios de sempre. O link
# do raw.githack continua valendo, preso a um commit.
#
# Só sai o arquivo do protótipo: nada do servidor, nada do banco, nenhum segredo.
# E a página publicada pede aos buscadores que não a indexem (noindex).
#
# Para ligar, uma vez, quem é dono do repositório: Settings, Pages, e em
# "Build and deployment", Source: GitHub Actions. Depois, Actions, este
# workflow, "Run workflow" (ou o próximo protótipo publica sozinho).
name: O protótipo no ar

on:
  push:
    branches: [claude/work-system-code-ready-0e3hh2]
    paths:
      - prototipo/rede-acolher-prototipo.html
      - .github/workflows/prototipo-no-ar.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prototipo-no-ar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicado.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: prototipo
          sparse-checkout-cone-mode: true

      - name: Monta o site só com o protótipo
        run: |
          mkdir site
          sed '0,/<head>/s//<head><meta name="robots" content="noindex, nofollow" \/>/' \
            prototipo/rede-acolher-prototipo.html > site/index.html
          grep -q 'content="noindex, nofollow"' site/index.html
          cp site/index.html site/rede-acolher-prototipo.html
          touch site/.nojekyll
          ls -la site

      # Tenta ligar o Pages na primeira vez; se o GitHub recusar, o clique do
      # dono em Settings, Pages, Source: GitHub Actions resolve, uma vez só.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicado
        uses: actions/deploy-pages@v4
