# Rede Acolher — infraestrutura de desenvolvimento
# Uso: docker compose up -d
# Nunca use estes valores em produção; segredos ficam fora do repositório (.env).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rede_acolher
      POSTGRES_USER: rede_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-dev-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rede_admin -d rede_acolher"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
