<title>Rede Acolher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* ============================================================
   REDE ACOLHER — Design System
   Marca: Fundação O Pão dos Pobres (navy #003262 / azul #005993)
   Cor = estado operacional, nunca julgamento sobre a pessoa.
   ============================================================ */

/* ---------- Tokens: tema claro ---------- */
:root{
  --ground:#EDF1F7; --surface:#FFFFFF; --raised:#F6F9FC; --sunken:#E3EAF3;
  --ink:#0F1C2E; --ink-2:#26374D; --muted:#5A6B82; --line:#D8E1EC; --line-2:#BDCBDC;

  --navy:#003262; --navy-2:#00254A;
  --brand:#005993; --brand-2:#0A7BC4; --brand-soft:#E2EFF9; --brand-solid:#005993;
  --on-navy:#DCEBF7;

  /* Paleta viva — cada matiz tem tom vivo (tinta/borda) e sólido (fundo cheio, AA) */
  --emerald:#10B981; --emerald-solid:#047857;
  --amber:#F59E0B;   --amber-solid:#B45309;
  --red:#EF4444;     --red-solid:#B91C1C;
  --blue:#3B82F6;    --blue-solid:#1D4ED8;
  --violet:#8B5CF6;  --violet-solid:#6D28D9;
  --cyan:#06B6D4;    --cyan-solid:#0E7490;
  --pink:#EC4899;    --pink-solid:#BE185D;
  --slate:#64748B;   --slate-solid:#475569;
  --on-solid:#FFFFFF;

  --shadow-1:0 1px 2px rgba(15,28,46,.05), 0 1px 3px rgba(15,28,46,.08);
  --shadow-2:0 2px 6px rgba(15,28,46,.06), 0 10px 24px rgba(15,28,46,.09);
  --shadow-up:0 -6px 28px rgba(15,28,46,.16);
  --focus:#0A7BC4;
  --r-sm:9px; --r-md:13px; --r-lg:18px;
}

/* ---------- Tokens: tema escuro ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C1219; --surface:#151E28; --raised:#1C2833; --sunken:#0F1720;
    --ink:#E8EEF5; --ink-2:#C6D3E0; --muted:#8FA1B5; --line:#26333F; --line-2:#3B4C5D;

    --navy:#0A1B2C; --navy-2:#061420;
    --brand:#4FA3DC; --brand-2:#7BC0EC; --brand-soft:#152C41; --brand-solid:#7BC0EC;
    --on-navy:#BFDCF2;

    --emerald:#34D399; --emerald-solid:#6EE7B7;
    --amber:#FBBF24;   --amber-solid:#FCD34D;
    --red:#F87171;     --red-solid:#FCA5A5;
    --blue:#60A5FA;    --blue-solid:#93C5FD;
    --violet:#A78BFA;  --violet-solid:#C4B5FD;
    --cyan:#22D3EE;    --cyan-solid:#67E8F9;
    --pink:#F472B6;    --pink-solid:#F9A8D4;
    --slate:#94A3B8;   --slate-solid:#CBD5E1;
    --on-solid:#07121C;

    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 2px 6px rgba(0,0,0,.45), 0 10px 24px rgba(0,0,0,.4);
    --shadow-up:0 -6px 28px rgba(0,0,0,.55);
    --focus:#7BC0EC;
  }
}
:root[data-theme="dark"]{
  --ground:#0C1219; --surface:#151E28; --raised:#1C2833; --sunken:#0F1720;
  --ink:#E8EEF5; --ink-2:#C6D3E0; --muted:#8FA1B5; --line:#26333F; --line-2:#3B4C5D;

  --navy:#0A1B2C; --navy-2:#061420;
  --brand:#4FA3DC; --brand-2:#7BC0EC; --brand-soft:#152C41; --brand-solid:#7BC0EC;
  --on-navy:#BFDCF2;

  --emerald:#34D399; --emerald-solid:#6EE7B7;
  --amber:#FBBF24;   --amber-solid:#FCD34D;
  --red:#F87171;     --red-solid:#FCA5A5;
  --blue:#60A5FA;    --blue-solid:#93C5FD;
  --violet:#A78BFA;  --violet-solid:#C4B5FD;
  --cyan:#22D3EE;    --cyan-solid:#67E8F9;
  --pink:#F472B6;    --pink-solid:#F9A8D4;
  --slate:#94A3B8;   --slate-solid:#CBD5E1;
  --on-solid:#07121C;

  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 2px 6px rgba(0,0,0,.45), 0 10px 24px rgba(0,0,0,.4);
  --shadow-up:0 -6px 28px rgba(0,0,0,.55);
  --focus:#7BC0EC;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.ff{font-family:"Plus Jakarta Sans","Atkinson Hyperlegible",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.011em}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){
  .card,.btn,.opt,.kidcard,.housecard{transition:transform .13s ease, box-shadow .13s ease, background-color .13s ease, border-color .13s ease}
  .btn:active,.opt:active,.kidcard:active,.housecard:active{transform:scale(.975)}
}

/* ---------- Barra de validação (ferramenta, não produto) ---------- */
.valbar{
  position:sticky;top:0;z-index:60;background:var(--sunken);
  border-bottom:1px solid var(--line);padding:8px 14px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
.valbar .tag{
  font-family:"Plus Jakarta Sans",sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-right:auto;
  display:inline-flex;align-items:center;gap:7px;
}
.valbar .tag i{width:7px;height:7px;border-radius:50%;background:var(--amber);display:block;font-style:normal}
.valbar select{
  background:var(--surface);color:var(--ink);border:1.5px solid var(--line-2);border-radius:var(--r-sm);
  padding:7px 9px;font:inherit;font-size:13.5px;font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;max-width:215px;
}
.tglbtn{
  border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;
  font-size:13px;font-weight:700;font-family:"Plus Jakarta Sans",sans-serif;display:inline-flex;gap:6px;align-items:center;
}
.tglbtn[aria-pressed="true"]{background:var(--amber-solid);border-color:var(--amber-solid);color:var(--on-solid)}

/* ---------- Casca do app ---------- */
.phone{max-width:468px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.appbar{
  background:linear-gradient(168deg,var(--navy) 0%,var(--navy-2) 100%);
  color:var(--on-navy);padding:14px 16px 16px;position:relative;
}
.appbar .top{display:flex;align-items:center;gap:10px}
.logochip{background:#fff;border-radius:9px;padding:3px 7px;display:inline-flex;align-items:center;flex:none}
.logochip img{height:26px;width:auto;display:block}
.appbar .wordmark{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:16px;color:#fff;letter-spacing:-.02em}
.appbar .rolechip{
  margin-left:auto;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);
  border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;
  font-family:"Plus Jakarta Sans",sans-serif;color:#fff;white-space:nowrap;max-width:52%;overflow:hidden;text-overflow:ellipsis;
}
.appbar h1{font-size:23px;font-weight:800;color:#fff;margin-top:14px}
.appbar .sub{font-size:13px;color:var(--on-navy);opacity:.92;margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.appbar .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5;display:inline-block}

.offbar{
  background:var(--amber-solid);color:var(--on-solid);padding:9px 16px;font-size:13.5px;
  display:flex;gap:9px;align-items:center;font-weight:700;
}
.offbar small{display:block;font-weight:400;opacity:.9;font-size:12px;margin-top:1px}

main.screen{flex:1;padding:16px 14px 128px;background:var(--ground)}

/* ---------- Navegação inferior ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);display:flex;justify-content:center;box-shadow:var(--shadow-up);
  padding-bottom:env(safe-area-inset-bottom);
}
/* Com a Fase 6 a coordenação passou de cinco para nove seções. Em vez de
   espremer todas na largura do aparelho — que é como se perde a última —
   a barra rola na horizontal e cada item guarda a largura mínima legível. */
.tabbar .inner{display:flex;width:100%;max-width:468px;overflow-x:auto;scrollbar-width:none}
.tabbar .inner::-webkit-scrollbar{display:none}
.tabbar button{
  flex:1 0 auto;min-width:70px;background:none;border:none;color:var(--muted);padding:8px 2px 10px;
  font-size:10.5px;font-weight:700;font-family:"Plus Jakarta Sans",sans-serif;
  display:flex;flex-direction:column;gap:5px;align-items:center;position:relative;line-height:1.15;text-align:center;
}
.tabbar button .ic{
  font-size:17px;line-height:1;width:38px;height:26px;display:grid;place-items:center;border-radius:999px;
}
.tabbar button[aria-current="true"]{color:var(--brand)}
.tabbar button[aria-current="true"] .ic{background:var(--brand-soft)}

/* ---------- Componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:15px;box-shadow:var(--shadow-1)}
.card.raise{box-shadow:var(--shadow-2)}
.stack{display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.eyebrow{
  font-family:"Plus Jakarta Sans",sans-serif;font-size:11px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin:22px 0 9px;display:flex;align-items:center;gap:9px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow:first-child{margin-top:2px}

/* Pílulas de estado — cor viva por matiz */
.pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;
  font-size:11.5px;font-weight:800;font-family:"Plus Jakarta Sans",sans-serif;white-space:nowrap;
  background:color-mix(in srgb, var(--c) 15%, var(--surface));
  color:var(--ct);border:1px solid color-mix(in srgb, var(--c) 34%, transparent);
}
.pill.solid{background:var(--ct);color:var(--on-solid);border-color:var(--ct)}
.c-ok{--c:var(--emerald);--ct:var(--emerald-solid)}
.c-warn{--c:var(--amber);--ct:var(--amber-solid)}
.c-crit{--c:var(--red);--ct:var(--red-solid)}
.c-info{--c:var(--blue);--ct:var(--blue-solid)}
.c-med{--c:var(--violet);--ct:var(--violet-solid)}
.c-move{--c:var(--cyan);--ct:var(--cyan-solid)}
.c-other{--c:var(--pink);--ct:var(--pink-solid)}
.c-mute{--c:var(--slate);--ct:var(--slate-solid)}
.c-brand{--c:var(--brand-2);--ct:var(--brand-solid)}

/* Botões */
.btn{
  border:none;border-radius:var(--r-sm);padding:11px 17px;font-weight:700;font-size:14.5px;
  font-family:"Plus Jakarta Sans",sans-serif;background:var(--brand-solid);color:var(--on-solid);
  box-shadow:var(--shadow-1);display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn.sec{background:var(--brand-soft);color:var(--brand-solid);box-shadow:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line-2);color:var(--ink-2);box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.tone{background:var(--ct);color:var(--on-solid)}

/* Campos */
input:not([type=checkbox]):not([type=radio]),textarea,select.field,.sheet select{
  width:100%;background:var(--raised);color:var(--ink);border:1.5px solid var(--line-2);
  border-radius:var(--r-sm);padding:11px 12px;font:inherit;font-size:15px;
}
textarea{min-height:78px;resize:vertical;font-size:14.5px}
label.f{display:block;font-size:13px;font-weight:800;margin:14px 0 6px;font-family:"Plus Jakarta Sans",sans-serif}
label.f small{font-weight:500;color:var(--muted);font-family:"Atkinson Hyperlegible",sans-serif}

/* Avisos */
.notice{
  border-radius:var(--r-md);padding:11px 13px;font-size:13.5px;line-height:1.4;
  background:color-mix(in srgb, var(--c) 12%, var(--surface));
  border-left:4px solid var(--c);color:var(--ink-2);
}
.notice b{color:var(--ct)}
.mutetxt{color:var(--muted);font-size:13px}
.audit{
  font-size:11.5px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);
  display:flex;gap:6px;align-items:center;
}
hr.divider{border:none;border-top:1px solid var(--line);margin:13px 0}

/* Tiles de indicador */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 13px;
  box-shadow:var(--shadow-1);border-top:3px solid var(--c);display:flex;flex-direction:column;gap:3px;
}
.tile .n{font-family:"Plus Jakarta Sans",sans-serif;font-size:24px;font-weight:800;color:var(--ct);font-variant-numeric:tabular-nums;line-height:1.05}
.tile .l{font-size:12px;color:var(--muted);line-height:1.25}

/* ---------- Linha do tempo ---------- */
.seg{
  display:flex;background:var(--sunken);border-radius:11px;padding:3px;margin-bottom:14px;gap:3px;
}
.seg button{
  flex:1;border:none;background:none;color:var(--muted);border-radius:8px;padding:8px 4px;
  font-size:13px;font-weight:700;font-family:"Plus Jakarta Sans",sans-serif;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand-solid);box-shadow:var(--shadow-1)}

.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:11px}
.tl-time{
  width:46px;flex:none;text-align:right;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:13.5px;
  font-variant-numeric:tabular-nums;color:var(--ct);padding-top:15px;letter-spacing:-.02em;
}
.tl-rail{width:14px;flex:none;display:flex;flex-direction:column;align-items:center}
.tl-dot{
  width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--c);
  margin-top:17px;flex:none;z-index:1;
}
.tl-item.now .tl-dot{background:var(--ct);border-color:var(--ct);box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent)}
.tl-item.done .tl-dot{background:var(--c);border-color:var(--c);opacity:.5}
.tl-line{width:2px;flex:1;background:var(--line)}
.tl-body{flex:1;padding-bottom:11px;min-width:0}
.tl-card{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:var(--r-md);padding:12px 13px;box-shadow:var(--shadow-1);
}
.tl-item.now .tl-card{box-shadow:var(--shadow-2);border-color:color-mix(in srgb, var(--c) 40%, var(--line))}
.tl-card .who{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:14.5px}
.tl-card .what{font-size:14.5px;color:var(--ink-2)}
.tl-item.done .tl-card{opacity:.82}

/* ---------- Visão dos 20 ---------- */
.kids{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kidcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;
  box-shadow:var(--shadow-1);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px;
}
.kidhead{display:flex;gap:9px;align-items:center}
.avatar{
  width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:13px;
  background:color-mix(in srgb, var(--c) 20%, var(--surface));color:var(--ct);
  border:1px solid color-mix(in srgb, var(--c) 32%, transparent);
}
.nm{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:14.5px;line-height:1.2;display:block}
.age{color:var(--muted);font-size:11.5px;display:block;line-height:1.25}
.kidtags{display:flex;flex-wrap:wrap;gap:5px}
.kidfoot{font-size:12px;color:var(--muted);line-height:1.3}
@media (max-width:359px){.kids,.tiles{grid-template-columns:1fr}}

/* ---------- Chips de opção (cores vivas) ---------- */
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{
  border:1.5px solid color-mix(in srgb, var(--c) 40%, transparent);
  background:color-mix(in srgb, var(--c) 9%, var(--surface));
  color:var(--ct);border-radius:999px;padding:7px 13px;
  font-size:12.5px;font-weight:700;font-family:"Plus Jakarta Sans",sans-serif;
}
.opt[aria-pressed="true"]{
  background:var(--ct);border-color:var(--ct);color:var(--on-solid);
  box-shadow:0 2px 10px color-mix(in srgb, var(--c) 45%, transparent);
}

/* ---------- Chamada ---------- */
.callrow{
  display:flex;flex-direction:column;gap:9px;padding:13px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);margin-bottom:9px;box-shadow:var(--shadow-1);
}
.callrow.filled{border-color:color-mix(in srgb, var(--emerald) 35%, var(--line))}
.progresswrap{position:sticky;top:47px;z-index:40;background:var(--ground);padding:10px 0 12px}
.progressbar{height:9px;border-radius:99px;background:var(--sunken);overflow:hidden}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--brand-2),var(--emerald));border-radius:99px;transition:width .25s ease}

/* ---------- Medicamentos ---------- */
.dose{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.dose:last-child{border-bottom:none}
.dose .hr{
  font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;
  width:48px;flex:none;color:var(--ct);font-size:14px;
}

/* ---------- Casas ---------- */
.houses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.housecard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px;
  box-shadow:var(--shadow-1);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:7px;
  border-top:3px solid var(--c);
}
.housecard .cd{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:16px;color:var(--ct);letter-spacing:-.02em}

/* ---------- Narrativas ---------- */
.sidebyside{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:430px){.sidebyside{grid-template-columns:1fr}}
.statement{
  background:color-mix(in srgb, var(--violet) 9%, var(--surface));
  border:1px solid color-mix(in srgb, var(--violet) 26%, transparent);
  border-radius:var(--r-md);padding:12px;font-size:13.5px;color:var(--ink-2);
}
.statement .au{
  font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:12px;
  color:var(--violet-solid);margin-bottom:6px;
}
.lista .li{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lista .li:last-child{border-bottom:none}

/* ---------- Sheet / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,17,28,.6);z-index:90;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:468px;
  max-height:88dvh;overflow:auto;padding:16px 16px 26px;box-shadow:var(--shadow-up);
}
.sheet .handle{width:42px;height:5px;border-radius:99px;background:var(--line-2);margin:0 auto 15px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:5px}
.checklist{margin:12px 0 0;padding-left:19px}
.checklist li{margin-bottom:9px;font-size:14px;color:var(--ink-2)}

/* ---------- Flutuantes ---------- */
.valfab{
  position:fixed;right:12px;bottom:78px;z-index:45;border:1px solid color-mix(in srgb, var(--blue) 38%, transparent);
  border-radius:999px;background:color-mix(in srgb, var(--blue) 16%, var(--surface));color:var(--blue-solid);
  font-weight:800;font-size:12px;font-family:"Plus Jakarta Sans",sans-serif;padding:8px 12px;box-shadow:var(--shadow-2);
  opacity:.94;
}
.valfab:hover,.valfab:focus-visible{opacity:1}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:95;
  background:var(--navy);color:#fff;border-radius:11px;padding:12px 17px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-2);max-width:92vw;text-align:center;line-height:1.35;
}
:root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{border:1px solid var(--line-2)}

/* ===== Entrada e equipe (espelham o sistema real) ===== */
.loginwrap{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%, #0A4A86 0%, transparent 60%),
  linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 55%,#001B38 100%)}
.logincard{width:100%;max-width:430px;background:var(--surface);color:var(--ink);
  border-radius:20px;padding:34px 30px 26px;box-shadow:0 24px 60px rgba(0,20,45,.45)}
.loginbrand{text-align:center;margin-bottom:22px}
.loginlogo{display:block;width:auto;max-width:230px;height:auto;margin:0 auto 18px}
:root[data-theme="dark"] .loginlogo, :root:not([data-theme="light"]) .loginlogo{
  background:#fff;border-radius:14px;padding:10px 14px}
/* No escuro o azul institucional some no fundo; o nome do sistema volta para o texto claro. */
:root[data-theme="dark"] .logincard h2, :root:not([data-theme="light"]) .logincard h2{color:var(--ink)}
.logincard h2{font-size:27px;line-height:1.2;margin:0;color:var(--navy);font-weight:800;letter-spacing:-.01em}
.logincard h2 span{display:block;font-size:15px;font-weight:600;color:var(--brand);
  margin-top:4px;letter-spacing:0}
.loginsub{margin:8px 0 0;font-size:13px;color:var(--muted);text-align:center}
.loginhint{margin:8px 0 4px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.loginfoot{margin:18px 0 0;font-size:12px;line-height:1.5;color:var(--muted);text-align:center}
.demochips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chipbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--brand);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.chipbtn:hover{background:var(--brand-soft);border-color:var(--brand)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tabela{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
.tabela thead th{background:var(--navy);color:var(--on-navy);text-align:left;padding:10px 13px;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.tabela td{padding:10px 13px;border-top:1px solid var(--line);vertical-align:middle}
.tabela tr.inativo td{opacity:.6}
.tabela td:first-child{white-space:nowrap}
.tabela .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);white-space:nowrap}
.tabela .acoes{white-space:nowrap;text-align:right}
.tabela .acoes .btn{width:auto;display:inline-flex;margin-left:6px}
.setoresgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
/* No celular a tabela vira lista: a coordenação precisa das ações à mão,
   e uma tabela de seis colunas num aparelho de 5 polegadas esconde justamente
   a coluna que decide (Situação e ações). */
/* A lista vale sempre: o app vive numa moldura de celular. */
.tablewrap{border:none;border-radius:0;overflow:visible}
.tabela{min-width:0;font-size:14px}
.tabela thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabela tr{display:block;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px;background:var(--surface)}
.tabela td{display:block;border:none;padding:3px 0}
.tabela td:first-child{white-space:normal;font-size:15px}
.tabela td[data-l]:not(:empty)::before{content:attr(data-l);display:block;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:2px}
.tabela .mono{white-space:normal;word-break:break-all}
.tabela .acoes{text-align:left;white-space:normal;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tabela .acoes .btn{margin-left:0}
/* Com uma folha aberta, o aviso sai de baixo (onde ficam os botões) e vai para o topo. */
.overlay ~ .toast{bottom:auto;top:16px}
.senhabox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sunken);

.senhabox code{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;color:var(--navy)}
.card > .row > .btn{width:auto;display:inline-flex}

/* ---------- Semântica de cor ----------
   Cor comunica ESTADO OPERACIONAL e categoria de atividade.
   Nunca julgamento, ranking ou pontuação sobre a pessoa.        */
const TIPO = {
  rotina:  {c:"c-mute",  ic:"🕰️"},
  refeicao:{c:"c-warn",  ic:"🍽️"},
  med:     {c:"c-med",   ic:"💊"},
  atv:     {c:"c-info",  ic:"📌"},
  saida:   {c:"c-move",  ic:"🚌"},
  plantao: {c:"c-ok",    ic:"🔁"},
};
function estadoCor(e){
  if(!e) return "c-mute";
  if(/no horário|Concluíd|Assinad|Registrado|Participou|Compareceu|Em dia|Normal/i.test(e)) return "c-ok";
  if(/atraso|Recus|Não realizada|Ausente|incidente|não autorizada|Erro/i.test(e)) return "c-crit";
  if(/Aguardando|pendente|substituição|Sem confirmação|Agendad|Rascunho|Atenção|Com pendência/i.test(e)) return "c-warn";
  if(/andamento|Ciente/i.test(e)) return "c-info";
  return "c-mute";
}
const pill = (txt, cls) => txt ? `<span class="pill ${cls || estadoCor(txt)}">${txt}</span>` : "";
const AV = ["c-info","c-ok","c-med","c-move","c-warn","c-other","c-brand","c-crit"];
const avatarCor = id => AV[id % AV.length];
const iniciais = n => n.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();

function vEducador(){
  const tabs = tabbar([
    {id:"tl", ic:"🕰️", label:"Linha do tempo"},
    {id:"kids", ic:"👥", label:"Os 20"},
    {id:"chamada", ic:"✅", label:"Chamada"},
    {id:"meds", ic:"💊", label:"Medicação"},
    {id:"passagem", ic:"🔁", label:"Passagem"},
  ]);
  const titulos = {tl:"Linha do tempo", kids:"Painel da casa", chamada:"Chamada coletiva", meds:"Medicamentos de hoje", passagem:"Minha passagem"};
  const inner = S.kidView ? vPerfil(S.kidView)
    : S.tab==="tl" ? vTimeline()
    : S.tab==="kids" ? vKids()
    : S.tab==="chamada" ? vChamada()
    : S.tab==="meds" ? vMeds()
    : vPassagem();
  shell(inner, tabs, appbar(S.kidView ? "Perfil do Acolhido" : titulos[S.tab], ["Casa 03", "Plantão diurno 07h–19h", HOJE]));
}

function vTimeline(){
  const evs = EVENTOS.filter(e => S.tlMode==="casa" ? true : (e.resp || e.precisaCiencia || e.tipo==="med"));
  const list = evs.map((e,i)=>{
    const t = TIPO[e.tipo] || TIPO.atv;
    const done = /Concluída|Administrado/.test(e.estado);
    const cor = e.crit ? "c-crit" : t.c;
    const who = e.kidId
      ? `<span class="who">${kid(e.kidId).social}, ${kid(e.kidId).idade}</span>`
      : `<span class="who">Coletiva</span>`;
    const acts = [];
    if(e.precisaCiencia && !e.ciencia) acts.push(`<button class="btn sm" onclick="A.ciencia('${e.id}')">Estou ciente</button>`);
    if(e.ciencia && !/Concluída|Em andamento/.test(e.estado)) acts.push(`<button class="btn sm sec" onclick="A.concluir('${e.id}')">Concluir</button>`);
    if(e.chamada) acts.push(`<button class="btn sm" onclick="A.setTab('chamada')">Abrir chamada</button>`);
    if(e.tipo==="med" && /Aguardando/.test(e.estado)) acts.push(`<button class="btn sm tone c-crit" onclick="A.medSheet('m4')">Confirmar dose</button>`);
    if(!done) acts.push(`<button class="btn sm ghost" onclick="A.excecao('${e.id}')">Exceção…</button>`);
    return `<div class="tl-item ${done?"done":""} ${e.destaque?"now":""} ${cor}">
      <div class="tl-time">${e.hora}</div>
      <div class="tl-rail"><div class="tl-dot"></div>${i<evs.length-1?'<div class="tl-line"></div>':""}</div>
      <div class="tl-body"><div class="tl-card">
        <div class="row" style="gap:7px">
          <span aria-hidden="true" style="font-size:15px">${t.ic}</span>
          <div class="grow">${who} <span class="what">· ${e.titulo}</span></div>
        </div>
        <div class="row" style="margin-top:8px">${pill(e.estado)}${e.resp?`<span class="mutetxt">${e.resp}</span>`:""}</div>
        ${e.nota?`<div class="mutetxt" style="margin-top:6px">${e.nota}</div>`:""}
        ${e.ciencia?`<div class="audit">✓ Ciência registrada · você · 08:12${S.offline?" · offline":""}</div>`:""}
        ${acts.length?`<div class="row" style="margin-top:10px">${acts.join("")}</div>`:""}
      </div></div>
    </div>`;
  }).join("");
  return `<div class="seg" role="group" aria-label="Modo de visão">
      <button aria-pressed="${S.tlMode==='casa'}" onclick="A.tlMode('casa')">Casa — todos</button>
      <button aria-pressed="${S.tlMode==='minhas'}" onclick="A.tlMode('minhas')">Minhas responsabilidades</button>
    </div>
    <div class="notice c-info" style="margin-bottom:14px">Tarefas individuais aparecem sempre na visão da casa — <b>nada fica oculto</b>. Toque no card para abrir o perfil.</div>
    <div class="tl">${list}</div>`;
}

/* ================= CADASTRO DO ACOLHIDO ================= */
/* Quem cadastra: equipe técnica e coordenação (§6.1). O bloco judicial é área
   restrita (§13.1) — quem cuida no dia a dia não lê o motivo do acolhimento. */
function vCadastro(){
  const c = CAPACIDADE, vagas = Math.max(c.limite - c.ocupadas, 0);
  const cheia = c.ocupadas >= c.limite;
  const acima = c.ocupadas > c.limite;
  const tom = acima ? "c-crit" : cheia ? "c-warn" : "c-ok";
  const hist = c.historico.length
    ? `<div class="stack" style="margin-top:10px">${c.historico.map(h=>
        `<div class="mutetxt">De <b>${h.de}</b> para <b>${h.para}</b> · ${h.autor} · ${h.quando}<br>${h.motivo}</div>`).join("")}</div>`
    : `<p class="mutetxt" style="margin:8px 0 0">Nenhuma mudança de limite registrada. As oito casas estão em 20.</p>`;

  return `<div class="card raise stack">
      <div class="row">
        <h3 class="grow" style="font-size:17px;margin:0">Cadastro de acolhido</h3>
        <button class="btn sm" onclick="A.cadastroNovo()">+ Novo cadastro</button>
      </div>
      <p class="mutetxt" style="margin:0">Identificação, acolhimento e situação judicial. O bloco judicial entra em <b>área restrita</b>: educador, líder, cozinha e enfermagem não leem o motivo.</p>
    </div>

    <div class="eyebrow">Vagas da Casa 03</div>
    <div class="card stack">
      <div class="row">
        <span class="grow"><b class="ff" style="font-size:22px">${c.ocupadas}</b> <span class="mutetxt">de ${c.limite}</span></span>
        ${pill(acima ? "Acima do limite" : cheia ? "No limite" : `${vagas} ${vagas===1?"vaga":"vagas"}`, tom)}
      </div>
      <div class="mutetxt">Limite desta unidade. Ele é da casa, não do sistema: mudar aqui não altera as outras sete.</div>
      ${S.role==="coordenador"
        ? `<button class="btn sec block" onclick="A.limiteAbrir()">Alterar limite da casa</button>`
        : `<p class="mutetxt" style="margin:0">Quem altera o limite é a coordenação da casa ou o Gestor Geral.</p>`}
      ${cheia ? `<div class="notice c-warn" style="margin:0">Casa no limite. Um novo acolhimento ainda é possível — o sistema pede uma justificativa que fica registrada. <b>A porta não trava.</b></div>` : ""}
    </div>

    <div class="eyebrow">Mudanças de limite</div>
    <div class="card">${hist}</div>`;
}

  return `<div class="eyebrow">Cofre de acessos do acolhido</div>
    <div class="card raise stack">
      <div class="row"><span style="font-size:20px" aria-hidden="true">🔑</span>

    </div>
    <div class="eyebrow">Quem abriu, quando e para quê</div>
    <div class="card"><div class="lista">${hist}</div>
      <p class="mutetxt" style="margin:10px 0 0">Cada abertura pede finalidade e fica registrada com nome e hora. O Gestor Geral só entra pela exceção — e a exceção aparece marcada, como acima.</p>

      ${a.estado==="falhou"?`<div class="notice c-crit" style="margin:0">${a.tentativas} tentativas · ${a.erro}. A equipe técnica e a coordenação foram avisadas. <b>O documento continua íntegro no sistema</b> — o que faltou foi a cópia no Drive.
        <button class="btn sm" style="margin-top:8px" onclick="A.arqTentar('${a.id}')">Tentar novamente</button></div>`:""}
    </div>`).join("");

  const falhas = ARQUIVO.filter(a=>a.estado==="falhou").length;
  return `<div class="card raise stack">
      <h3 style="font-size:17px;margin:0">Arquivo documental</h3>
      <div class="mutetxt">Cópia do que fechou, no Drive institucional</div>
      <div class="notice c-info" style="margin:0">Não é backup do sistema — banco e arquivos têm backup técnico próprio. Aqui vai a cópia documental do que a instituição <b>fechou</b>: ATA, passagem, ocorrência, acompanhamento, relatório.</div>
      ${falhas?`<div class="notice c-crit" style="margin:0">${falhas} documento(s) fechado(s) ainda não chegaram ao arquivo.</div>`
              :`<div class="notice c-ok" style="margin:0">Tudo o que fechou está arquivado e verificado.</div>`}
    </div>
    <div class="eyebrow">Fila e histórico</div>
    <div class="stack">${linhas}</div>
    <p class="mutetxt" style="margin-top:12px">Nunca sobrescreve: correção vira <b>V2_ADENDO</b>, ao lado da V1. O nome do arquivo não carrega nome, CPF nem diagnóstico — quem precisa saber de quem é abre o sistema, onde a leitura tem permissão e registro.</p>`;
}

/* ================= COORDENAÇÃO ================= */
function vTransferencias(){
  const sub = S.transfSub;
  const seletor = `<div class="opts" style="margin-bottom:14px">
    <button class="opt c-info" aria-pressed="${sub==="recebidas"}" onclick="A.transfSub('recebidas')">
      Recebidas de outras casas${TRANSF_RECEBIDAS.filter(t=>t.status==="solicitada").length?` · ${TRANSF_RECEBIDAS.filter(t=>t.status==="solicitada").length}`:""}</button>
    <button class="opt c-move" aria-pressed="${sub==="casa"}" onclick="A.transfSub('casa')">Transferências da casa</button>
  </div>`;

  const conversa = t => {
    if(S.transfChat !== t.id) return "";
    const linhas = t.msgs.length
      ? t.msgs.map(m=>`<div class="statement"><div class="au">${m.autor} · ${m.casa}</div>${m.txt}</div>`).join("")
      : `<p class="mutetxt" style="margin:0">Ainda não há mensagens sobre esta solicitação.</p>`;
    return `<hr class="divider">
      <div class="eyebrow" style="margin-top:0">Conversa entre as coordenações</div>
      <div class="stack">${linhas}</div>
      <label class="f">Sua mensagem</label>
      <textarea id="msg-${t.id}" placeholder="Escreva para a outra coordenação…"></textarea>
      <button class="btn sec block" onclick="A.transfMsg('${t.id}')">Enviar mensagem</button>
      <p class="mutetxt" style="margin:6px 0 0">A conversa fica dentro do sistema, ligada a esta solicitação, e não pode ser apagada. Nenhuma coordenação entra na casa da outra para falar.</p>`;
  };

  let inner;
  if(sub === "recebidas"){
    const lista = TRANSF_RECEBIDAS.length ? TRANSF_RECEBIDAS.map(t=>`
      <div class="card raise stack" style="border-left:4px solid var(--blue)">
        <div class="row"><b class="ff grow" style="font-size:16px">${t.nome}</b>${pill(...TRANSF_STATUS[t.status])}</div>
        <div class="mutetxt">Chamado(a) de <b>${t.social}</b> · ${t.idade} anos</div>
        <div class="row"><span class="pill c-move">Vem de ${t.origem}</span></div>
        <div><b class="ff">Motivo:</b> ${t.motivo}</div>
        <div class="mutetxt">Solicitado por ${t.por} · ${t.quando}</div>
        ${t.status==="solicitada" ? `<div class="row" style="gap:8px">
          <button class="btn grow" onclick="A.transfAceitar('${t.id}')">✓ Aceitar</button>
          <button class="btn sec grow" onclick="A.transfRecusar('${t.id}')">Recusar com motivo</button>
        </div>
        <button class="btn ghost sm block" onclick="A.transfChat('${t.id}')">
          ${S.transfChat===t.id?"Fechar conversa":`💬 Conversar com a coordenação de origem${t.msgs.length?` (${t.msgs.length})`:""}`}</button>` : ""}
        ${conversa(t)}
      </div>`).join("")
      : `<div class="card"><p class="mutetxt" style="margin:0">Nenhuma solicitação recebida no momento.</p></div>`;

    inner = `${seletor}
      <div class="notice c-info" style="margin-bottom:14px">Você vê <b>quem é</b>, <b>de onde vem</b> e <b>por quê</b> — o necessário para decidir. O perfil completo (saúde, documentos, benefícios e histórico) só abre <b>depois do aceite</b>.</div>
      <div class="stack">${lista}</div>`;
  } else {
    const lista = TRANSF_CASA.map(t=>`
      <div class="card stack" style="border-left:4px solid var(--${t.status==="devolvida"?"red":t.status==="aceita"?"emerald":"amber"})">
        <div class="row"><b class="ff grow" style="font-size:16px">${t.nome}</b>${pill(...TRANSF_STATUS[t.status])}</div>
        <div class="mutetxt">${t.idade} anos · destino <b>${t.destino}</b></div>
        <div><b class="ff">Motivo:</b> ${t.motivo}</div>
        <div class="mutetxt">Solicitado por ${t.por} · ${t.quando}</div>
        ${t.justificativa ? `<div class="notice c-crit" style="margin:0"><b>Recusada por ${t.decidiuPor} em ${t.decidiuEm}:</b><br>${t.justificativa}</div>` : ""}
        ${t.status==="solicitada" ? `<div class="row" style="gap:8px">
          <button class="btn ghost sm grow" onclick="A.transfChat('${t.id}')">
            ${S.transfChat===t.id?"Fechar conversa":"💬 Conversar com o destino"}</button>
          <button class="btn ghost sm grow" onclick="toast('No sistema real: cancelamento com motivo, enquanto o destino não decidiu.')">Cancelar pedido</button>
        </div>` : ""}
        ${conversa(t)}
      </div>`).join("");

    inner = `${seletor}
      <div class="stack">${lista}</div>
      <div class="card stack" style="margin-top:14px">
        <b class="ff">Nova transferência</b>
        <p class="mutetxt" style="margin:0">Escolha o acolhido no painel da casa e a unidade de destino. O motivo é obrigatório: é ele que a outra coordenação vai ler para decidir.</p>
        <button class="btn sec block" onclick="toast('No sistema real: escolher acolhido, destino entre as 8 unidades e escrever o motivo.')">Solicitar transferência</button>
      </div>
      <p class="mutetxt" style="margin-top:12px">A criança só muda de casa <b>no aceite</b>. Até lá, a responsabilidade continua sendo desta unidade.</p>`;
  }
  return inner;
}

function vLogin(){
  const chips = Object.entries(ROLES).map(([k,v])=>
    `<button class="chipbtn" onclick="A.entrar('${k}')">${v}</button>`).join("");
  app.innerHTML = `<div class="loginwrap">
    <div class="logincard">
      <div class="loginbrand">
        <img class="loginlogo" src="${LOGO_PAO}" alt="Fundação O Pão dos Pobres">
        <h2>Rede Acolher<span>Acolhimento Institucional</span></h2>
        <p class="loginsub">Sistema de gestão do acolhimento</p>
      </div>
      <label class="f" style="margin-top:0">E-mail institucional</label>
      <input type="email" placeholder="nome@paodospobres.org.br" value="coord.ai3@paodospobres.dev">
      <label class="f">Senha</label>
      <input type="password" placeholder="Sua senha" value="senha-inicial">
      <p class="loginhint">🔒 No primeiro acesso, use a senha entregue pela coordenação — o sistema vai sugerir que você crie uma senha só sua.</p>
      <button class="btn block" onclick="A.entrar('coordenador')">Entrar no sistema</button>
      <hr class="divider">
      <p class="loginsub" style="margin-bottom:8px">Acesso rápido — protótipo, dados fictícios</p>
      <div class="demochips">${chips}</div>
      <p class="loginfoot">Conta individual. Ninguém assina, confirma ou registra em nome de outra pessoa.</p>
    </div></div>`;
}

/* ================= EQUIPE (coordenação) ================= */
function vEquipe(){
  const ativos = EQUIPE.filter(u=>u.ativo).length;
  const linhas = EQUIPE.map(u=>{
    const st = setorDe(u.cargo);
    const acoes = u.propria ? "" : `
      <button class="btn sm ghost" onclick="A.equipeEditar('${u.id}')">Editar</button>
      <button class="btn sm ghost" onclick="toast('Nova senha gerada e mostrada uma única vez. As sessões abertas caem.')">Nova senha</button>
      ${u.ativo
        ? `<button class="btn sm ghost" onclick="A.equipeDesativar('${u.id}')">Desativar</button>`
        : `<button class="btn sm ghost" onclick="A.equipeReativar('${u.id}')">Reativar</button>`}`;
    return `<tr class="${u.ativo?"":"inativo"}">
      <td><b class="ff">${u.nome}</b>${u.propria?' <span class="pill c-mute">você</span>':""}</td>
      <td class="mono" data-l="E-mail">${u.email}</td>
      <td data-l="Setor"><span class="pill ${u.c||st.c}">${u.setor||st.label}</span></td>
      <td data-l="Casa">${st.transversal?'<span class="mutetxt">8 casas</span>':(u.casa||"—")}</td>
      <td data-l="Situação">${u.ativo?pill("Ativo","c-ok"):pill("Desativado","c-mute")}
          ${u.ativo&&u.inicial?' <span class="pill c-warn">senha inicial</span>':""}
          ${!u.ativo&&u.motivo?`<div class="mutetxt" style="margin-top:4px">${u.motivo}</div>`:""}</td>
      <td class="acoes">${acoes}</td></tr>`;
  }).join("");

  const setores = SETORES_EQUIPE.map(st=>{
    const n = EQUIPE.filter(u=>u.cargo===st.cod && u.ativo).length;
    return `<div class="card">
      <div class="row"><span class="pill ${st.c}">${st.label}</span>
        <span class="mutetxt grow">${n} ${n===1?"pessoa":"pessoas"}</span>
        ${st.transversal?pill("8 casas","c-move"):""}</div>
      <div class="mutetxt">${st.desc}</div></div>`;
  }).join("");

  return `<div class="card raise">
      <div class="row" style="margin-bottom:12px;gap:10px">
        <div class="grow">
          <h3 style="font-size:17px;margin:0">Equipe cadastrada</h3>
          <div class="mutetxt">${ativos} ativos · ${EQUIPE.length} no total</div>
        </div>
        <button class="btn sm" onclick="A.equipeNovo()">+ Novo cadastro</button>
      </div>
      <div class="tablewrap"><table class="tabela">
        <thead><tr><th>Nome</th><th>E-mail</th><th>Setor</th><th>Casa</th><th>Situação</th><th></th></tr></thead>
        <tbody>${linhas}</tbody></table></div>
      <p class="mutetxt" style="margin:12px 0 0">Não existe remover. Desligado é <b>desativado</b>: o acesso acaba na hora e as sessões abertas caem, mas tudo o que a pessoa registrou continua com o nome dela.</p>
    </div>
    <div class="eyebrow">Setores e o que cada um alcança</div>
    <div class="setoresgrid">${setores}</div>
    <p class="mutetxt" style="margin-top:12px">A coordenação cadastra a equipe da casa e a Enfermagem. Criar conta de alcance institucional — Gestor Geral, TI — é do Gestor Geral: se a coordenação pudesse, bastaria cadastrar alguém para enxergar as oito casas.</p>`;
}

function vCoordenador(){
  const tabs = tabbar([{id:"casa", ic:"🏠", label:"Casa"},{id:"agenda", ic:"🗓️", label:"Agenda"},{id:"cadastro", ic:"🧒", label:"Cadastro"},{id:"equipe", ic:"👥", label:"Equipe"},{id:"acomp", ic:"📝", label:"Acompanhar"},{id:"relat", ic:"📄", label:"Relatórios"},{id:"arquivo", ic:"🗄️", label:"Arquivo"},{id:"transf", ic:"🔁", label:"Transferências"},{id:"aprova", ic:"✅", label:"Aprovações"},{id:"banco", ic:"🔐", label:"Benefícios"}]);
  let inner;
  if(S.tab==="agenda"){
    inner = vAgenda();
  } else if(S.tab==="cadastro"){
    inner = vCadastro();
  } else if(S.tab==="acomp"){
    inner = vAcompanhamentos();
  } else if(S.tab==="relat"){
    inner = vRelatorios();
  } else if(S.tab==="arquivo"){
    inner = vArquivo();
  } else if(S.tab==="equipe"){
    inner = vEquipe();
  } else if(S.tab==="transf"){
    inner = vTransferencias();
  } else if(S.tab==="banco"){
    inner = !S.reauth
      ? `<div class="card raise stack">
          <div class="row"><span style="font-size:22px" aria-hidden="true">🔐</span><h3 class="grow" style="font-size:17px">Benefícios e dados bancários</h3></div>
          <div class="notice c-med">Área altamente restrita: somente coordenação da casa atual e Gestor Geral. Cada visualização, edição, impressão e exportação gera <b>log específico</b>. Nunca aparece em linha do tempo, ATA, notificação ou busca ampla.</div>
          <label class="f">Confirme sua senha para continuar</label>
          <input type="password" placeholder="Senha do e-mail institucional" aria-label="Senha">
          <button class="btn block" onclick="A.reauthOk()">Confirmar identidade</button>
        </div>`
      : `<div class="card raise stack">
          <div class="row"><h3 class="grow" style="font-size:17px">Benefícios · Casa 03</h3><span class="pill c-med solid">Acesso auditado</span></div>
          <div class="lista">
          ${[["Felipe A.","BPC · Caixa ag. 0000 c/ 00000-0","você, agora"],
             ["Otávio G.","Poupança institucional · Banrisul","gestor, 12/08"],

  fuEnviar(id){

    toast("Seguindo com a senha inicial — a coordenação continua vendo isso na lista de equipe");
  },
  senhaOk(){ S.sheet=null; S.sugereSenha=false; render(); toast("Senha alterada. As outras sessões abertas foram encerradas."); },

  equipeNovo(){ A.equipeForm(null); },
  equipeEditar(id){ A.equipeForm(EQUIPE.find(u=>u.id===id)); },
  equipeForm(u){
    const editar = !!u;
    const opts = SETORES_EQUIPE.map(st=>
      `<option value="${st.cod}" ${u&&u.cargo===st.cod?"selected":""}>${st.label}</option>`).join("");
    S.sheet = `<h3>${editar?`Editar ${u.nome}`:"Cadastrar profissional"}</h3>
      <label class="f" style="margin-top:0">Nome completo</label>
      <input id="eq-nome" value="${editar?u.nome:""}" placeholder="Nome como consta no crachá">
      <label class="f">E-mail institucional</label>
      <input id="eq-mail" value="${editar?u.email:""}" ${editar?"disabled":""} placeholder="nome@paodospobres.org.br">
      ${editar?'<p class="mutetxt">O e-mail identifica a conta e não muda.</p>':""}
      <label class="f">Setor</label>
      <select id="eq-setor" onchange="A.equipeSetor()">${opts}</select>
      <p class="mutetxt" id="eq-desc">${setorDe(u?u.cargo:"educador").desc}</p>
      <div id="eq-casa">${A.blocoCasa(u?setorDe(u.cargo).transversal:false)}</div>
      ${editar?"":`<div class="notice c-info">O sistema gera uma <b>senha inicial</b> e mostra uma única vez. Entregue à pessoa; no primeiro acesso ela é convidada a criar a sua.</div>`}
      <div class="row" style="gap:8px;margin-top:16px">
        <button class="btn sec grow" onclick="A.closeSheet()">Cancelar</button>
        <button class="btn grow" onclick="A.equipeSalvar(${editar?`'${u.id}'`:"null"})">${editar?"Salvar alterações":"Cadastrar"}</button>
      </div>`;
    render();
  },
  blocoCasa(transversal){
    return transversal
      ? `<div class="notice c-move">Este é um cargo <b>transversal</b>: alcança as oito casas por função, sem vínculo com uma unidade (§5.13).</div>`
      : `<label class="f">Casa</label>
         <select id="eq-casaid">${CASAS.map(c=>`<option ${c.cod==="AI3"?"selected":""}>${c.cod} — ${c.nome}</option>`).join("")}</select>`;
  },
  equipeSetor(){
    const cod = document.getElementById("eq-setor").value, st = setorDe(cod);
    document.getElementById("eq-desc").textContent = st.desc;
    document.getElementById("eq-casa").innerHTML = A.blocoCasa(st.transversal);
  },
  equipeSalvar(id){
    const nome = (document.getElementById("eq-nome")?.value || "").trim();
    const mail = (document.getElementById("eq-mail")?.value || "").trim();
    const cod  = document.getElementById("eq-setor").value;
    const st   = setorDe(cod);
    if(nome.length < 3){ toast("Informe o nome completo"); return; }
    if(id){
      const u = EQUIPE.find(x=>x.id===id);
      u.nome = nome; u.cargo = cod; u.setor = null; u.c = null;
      u.casa = st.transversal ? null : "AI3";
      S.sheet=null; render(); toast("Cadastro atualizado");
    } else {
      if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(mail)){ toast("E-mail institucional inválido"); return; }
      if(EQUIPE.some(u=>u.email===mail)){ toast("Já existe uma conta com este e-mail"); return; }
      const senha = ["acolher","cuidado","plantao","unidade","equipe"][Math.floor(Math.random()*5)]
                    + "-" + Math.floor(1000+Math.random()*9000);
      EQUIPE.push({id:"u"+(EQUIPE.length+1), nome, email:mail, cargo:cod,
                   casa: st.transversal?null:"AI3", ativo:true, inicial:true});
      S.sheet = `<h3>✅ ${nome} cadastrado(a)</h3>
        <p class="mutetxt">Setor: <b>${st.label}</b>${st.transversal?" · alcança as oito casas":" · Casa 03"}</p>
        <div class="senhabox"><span class="mutetxt">Senha inicial</span><code>${senha}</code></div>
        <p class="mutetxt" style="margin-top:10px">Entregue esta senha à pessoa — ela é mostrada <b>uma única vez</b>. No primeiro acesso o sistema sugere que ela crie a sua, e até lá a lista mostra “senha inicial”.</p>
        <button class="btn block" onclick="A.closeSheet()">Fechar</button>`;
      render();
    }
  },
  equipeDesativar(id){
    const u = EQUIPE.find(x=>x.id===id);
    S.sheet = `<h3>Desativar ${u.nome}</h3>
      <div class="notice c-warn" style="margin:12px 0">Desligado é <b>desativado</b>, nunca apagado: o acesso acaba na hora e as sessões abertas caem, mas cada passagem assinada, cada ATA fechada e cada dose confirmada por esta pessoa continuam com o nome dela.</div>
      <label class="f" style="margin-top:0">Motivo</label>
      <textarea id="eq-motivo" placeholder="Ex.: desligamento a pedido, em 27/08"></textarea>
      <button class="btn block" onclick="A.equipeDesativarOk('${id}')">Registrar desativação</button>`;
    render();
  },
  equipeDesativarOk(id){
    const m = (document.getElementById("eq-motivo")?.value || "").trim();
    if(m.length < 5){ toast("Descreva o motivo — ele fica registrado"); return; }
    const u = EQUIPE.find(x=>x.id===id); u.ativo=false; u.motivo=m;
    S.sheet=null; render(); toast("Desativado e sessões encerradas. O histórico permanece.");
  },
  equipeReativar(id){
    const u = EQUIPE.find(x=>x.id===id); u.ativo=true; u.motivo=null;
    render(); toast("Reativado — o histórico dele nunca deixou de existir");
  },

  /* ---------- Transferências (§15.6) ---------- */
  transfSub(x){ S.transfSub=x; S.transfChat=null; render(); },
  transfChat(id){ S.transfChat = S.transfChat===id ? null : id; render(); },
  transfMsg(id){
    const el = document.getElementById(`msg-${id}`);
    const txt = (el?.value || "").trim();
    if(!txt){ toast("Escreva a mensagem antes de enviar"); return; }
    const t = TRANSF_RECEBIDAS.concat(TRANSF_CASA).find(x=>x.id===id);
    t.msgs.push({casa:"AI3", autor:"você (Coordenação Casa 03)", txt});
    fila(); render();
    toast("Mensagem registrada — a outra coordenação foi avisada dentro do sistema");
  },
  transfAceitar(id){
    const t = TRANSF_RECEBIDAS.find(x=>x.id===id);
    S.sheet = `<h3>Aceitar ${t.social}?</h3>
      <p class="mutetxt">${t.nome} · ${t.idade} anos · vem de ${t.origem}</p>
      <div class="notice c-info" style="margin:12px 0">Ao aceitar, e só então:
        <ul class="checklist" style="margin-top:8px">
          <li>a casa atual passa a ser a sua e o perfil abre por completo;</li>
          <li>histórico, documentos, medicamentos, alergias e pendências vêm junto;</li>
          <li>as ATAs fechadas da origem continuam imutáveis;</li>
          <li>os dados bancários deixam a coordenação de origem e passam à sua.</li>
        </ul></div>
      <label class="f">Observação para o registro <small>— opcional</small></label>
      <textarea placeholder="Ex.: vaga confirmada no quarto 2, chegada combinada para quinta…"></textarea>
      <button class="btn block" style="margin-top:14px" onclick="A.transfAceitarOk('${id}')">Confirmar aceite</button>`;
    render();
  },
  transfAceitarOk(id){
    const t = TRANSF_RECEBIDAS.find(x=>x.id===id);
    t.status = "aceita"; S.sheet=null; S.transfChat=null; fila();
    toast(`${t.social} agora é da Casa 03 — perfil completo liberado e origem notificada`);
  },
  transfRecusar(id){
    const t = TRANSF_RECEBIDAS.find(x=>x.id===id);
    S.sheet = `<h3>Recusar a transferência de ${t.social}</h3>
      <div class="notice c-crit" style="margin:12px 0">O motivo é <b>obrigatório</b> e fica registrado <b>nas duas casas</b>. É por ele que a coordenação de origem decide o próximo passo da criança.</div>
      <label class="f" style="margin-top:0">Motivo da recusa</label>
      <textarea id="rec-${id}" placeholder="Ex.: sem vaga no perfil etário até o fim do mês; sugerimos reavaliar em 30 dias…"></textarea>
      <button class="btn block" style="margin-top:14px" onclick="A.transfRecusarOk('${id}')">Registrar recusa</button>`;
    render();
  },
  transfRecusarOk(id){
    const el = document.getElementById(`rec-${id}`);
    const txt = (el?.value || "").trim();
    if(txt.length < 15){ toast("Descreva o motivo — ele será lido pela outra coordenação"); return; }
    const t = TRANSF_RECEBIDAS.find(x=>x.id===id);
    t.status = "devolvida"; t.justificativa = txt; S.sheet=null; fila();
    toast("Recusa registrada com justificativa nas duas casas — nada mudou de lugar");
  },

  /* ---------- Ocorrências (§13) ---------- */
  novaOcorrencia(){
    S.sheet = `<h3>Registrar ocorrência</h3>
      <div class="notice c-crit" style="margin:10px 0">O registro <b>nunca</b> deve atrasar a proteção imediata, o atendimento de saúde ou o protocolo institucional. Abra com o mínimo — o resto entra depois.</div>
      <label class="f" style="margin-top:0">Categoria</label>
      <div class="opts">${OCORRENCIAS.map(o=>`
        <button class="opt ${o.c}" onclick="A.ocorrenciaOk('${o.cod}')">${o.l}</button>`).join("")}</div>
      <p class="mutetxt" style="margin-top:12px">Violência ou suspeita, contenção, erro de medicamento e emergência de saúde <b>não se encerram</b> sem validação da equipe técnica ou da coordenação.</p>`;
    render();
  },
  ocorrenciaOk(cod){
    const o = OCORRENCIAS.find(x=>x.cod===cod);
    const avisados = ["Líder Diurno","equipe técnica","coordenação"]
      .concat(/saude|medicamento/.test(cod) ? ["Enfermagem"] : []);
    S.sheet = `<h3>${o.l}</h3>
      <div class="row" style="margin:8px 0">${pill(o.rev?"Exige revisão técnica":"Encerramento operacional", o.rev?"c-med":"c-info")}
        ${o.res?pill("Acesso restrito","c-crit"):""}</div>
      <label class="f" style="margin-top:0">Fato objetivo <small>— o que aconteceu, sem interpretação</small></label>
      <textarea placeholder="Descreva o fato, o horário e o que foi feito imediatamente…"></textarea>
      <label class="f">Medidas imediatas</label>
      <textarea placeholder="O que foi feito para proteger e atender…"></textarea>
      ${o.res ? `<label class="f">Fala espontânea do acolhido <small>— transcrição, sem interpretação</small></label>
      <div class="notice c-med" style="margin-bottom:9px">Este campo e os sinais observados <b>não aparecem</b> para colegas de plantão. Acesso: você, equipe técnica e coordenação.</div>
      <textarea placeholder="Transcreva o que foi dito, entre aspas…"></textarea>` : ""}
      ${cod==="contencao" ? `<div class="notice c-warn" style="margin-top:10px">A contenção exige campos próprios: antecedentes, local, presentes, tentativas anteriores, método, duração, possível lesão e avaliação de saúde. <b>O sistema não avalia se a medida foi adequada</b> — essa análise é humana.</div>` : ""}
      <button class="btn block" style="margin-top:16px" onclick="A.ocorrenciaAbrir('${cod}')">Abrir ocorrência e avisar</button>
      <p class="mutetxt" style="margin-top:9px">Serão avisados na hora: ${avisados.join(", ")}. O Gestor Geral <b>não</b> recebe automaticamente — quem escalona a ele é a equipe técnica ou a coordenação, conforme a gravidade.</p>`;
    render();
  },
  ocorrenciaAbrir(cod){
    const o = OCORRENCIAS.find(x=>x.cod===cod);
    S.sheet=null; fila();
    toast(o.rev
      ? "Ocorrência aberta. Encerrada a etapa operacional, ela AGUARDA revisão técnica — não fecha sozinha."
      : "Ocorrência aberta. Líder, equipe técnica e coordenação foram avisados.");
  },
  verOcorrencia(){
    S.sheet = `<h3>Saída não autorizada · Kauã</h3>
      <div class="row" style="margin:8px 0">${pill("Aguardando revisão técnica","c-med")}${pill("Etapa operacional encerrada","c-info")}</div>
      <p class="mutetxt" style="margin:0">Ontem 21:40 · retorno 23:15 acompanhado · etapa operacional encerrada pelo Líder Noturno Geral, que <b>não</b> navegou pelas narrativas restritas.</p>
      <div class="eyebrow">Relatos independentes — originais imutáveis</div>
      <div class="sidebyside">
        <div class="statement"><div class="au">Ed. J. Costa · presenciei parcialmente</div>Vi quando saiu pelo portão dos fundos; chamei o líder imediatamente.</div>
        <div class="statement"><div class="au">Ed. P. Rocha · soube depois</div>Estava na outra ala. Soube pelo rádio e acompanhei o retorno.</div>
      </div>
      <div class="eyebrow">Síntese técnica <small>— registro novo, não apaga nenhum relato</small></div>
      <textarea placeholder="A que se chegou, e o que fica combinado…"></textarea>
      <div class="eyebrow">Comunicação externa</div>
      <div class="card stack" style="border-left:4px solid var(--blue)">
        <div class="row"><span class="grow"><b class="ff">Conselho Tutelar</b> · ofício · destinatário funcional</span>${pill("Aprovado","c-ok")}</div>
        <div class="notice c-info" style="margin:0">O sistema <b>não envia</b> nada para fora. Ele registra, gera o documento, guarda a aprovação e registra que uma pessoa entregou — com nome e horário.</div>
        <button class="btn sm sec" onclick="toast('Entrega registrada com responsável e horário. Nenhum envio automático.')">Registrar entrega feita</button>
      </div>
      <div class="row" style="margin-top:16px;gap:8px">
        <button class="btn grow" onclick="A.closeSheet();toast('Validada e fechada. Histórico preservado e reabrível.')">Validar e fechar</button>
        <button class="btn sec grow" onclick="A.closeSheet();toast('Reaberta com histórico — nada foi apagado.')">Reabrir</button>
      </div>`;
    render();
  },

  abrirChamada(){ S.chamadaAberta=true; render(); },
  marcar(id,op){ S.chamada[id]=op; fila(); render(); },
  marcarTodosNormais(){ KIDS.forEach(k=>{ if(!S.chamada[k.id]) S.chamada[k.id]="Normal"; }); toast("Pré-marcado — revise um a um antes de confirmar"); render(); },
  fecharChamada(){
    S.chamadaAberta=false; S.chamadaConfirmada=true;
    const e=EVENTOS.find(x=>x.id==="e8"); e.estado="Concluída no horário"; e.chamada=false;
    const exc = Object.values(S.chamada).filter(v=>v!=="Normal").length;
    e.nota = `Chamada registrada · ${20-exc} normais, ${exc} com anotação`;
    toast("Chamada confirmada — 20 registros individuais criados"); render();
  },

  medSheet(id){
    const m = MEDS.find(x=>x.id===id), k = kid(m.kidId);
    const bloqueado = S.offline && !S.instDevice;
    const OPTS = [["Administrado no horário","c-ok"],["Administrado com atraso","c-warn"],["Recusado","c-crit"],
      ["Indisponível","c-other"],["Acolhido ausente","c-move"],["Incidente","c-crit"]];
    S.sheet = `<h3>Confirmar dose · ${k.social}</h3>
      <p class="mutetxt">${m.nome} ${m.dose} · ${m.via} · previsto ${m.hora}</p>
      ${k.alergia?`<div class="notice c-crit" style="margin-top:11px">⚠ Alergia registrada: <b>${k.alergia}</b></div>`:""}
      ${S.offline?`<label class="f" style="display:flex;gap:9px;align-items:center;cursor:pointer">
        <input type="checkbox" ${S.instDevice?"checked":""} onchange="A.instDev(this.checked,'${id}')" style="width:auto">
        Este é o aparelho institucional designado da casa</label>`:""}
      ${bloqueado
        ? `<div class="notice c-warn" style="margin-top:11px">Offline, somente o <b>aparelho institucional designado</b> confirma medicamento — evita duplicidade entre aparelhos desconectados. Celular pessoal consulta e registra outras atividades.</div>`
        : `<div class="notice c-info" style="margin-top:11px">A confirmação é individual e intransferível: <b>só confirma quem administrou</b>.</div>
           <label class="f">Resultado</label>
           <div class="opts">${OPTS.map(([o,c])=>`<button class="opt ${c}" onclick="A.medOk('${id}','${o}')">${o}</button>`).join("")}</div>
           <label class="f">Observação <small>— obrigatória para recusa, atraso, omissão ou incidente</small></label>
           <textarea placeholder="Ex.: recusou a primeira oferta; aceitou após conversa…"></textarea>`}`;
    render();
  },
  instDev(v,id){ S.instDevice=v; A.medSheet(id); },
  medOk(id,estado){
    const m = MEDS.find(x=>x.id===id);
    m.estado=estado; m.por="Você";
    const e = EVENTOS.find(x=>x.tipo==="med" && x.kidId===m.kidId && x.hora===m.hora);
    if(e){ e.estado=estado; e.crit=false; }
    S.sheet=null; fila();
    toast(estado.startsWith("Administrado")
      ? "Dose confirmada — horário real registrado"
      : `Registrado: ${estado} — Enfermagem, técnica e coordenação notificadas`);
  },
  resumoSaude(nome){
    S.sheet = `<h3>Resumo de Saúde · ${nome}</h3>
      <label class="f">Finalidade da emissão <small>— obrigatória e auditada</small></label>
      <select class="field"><option>Consulta</option><option>Exame</option><option>Urgência/emergência</option><option>Internação</option><option>Transferência assistencial</option></select>
      <div class="notice c-warn" style="margin-top:12px">Contém somente o necessário: identificação, alergias, restrições, condições relevantes, medicamentos ativos e atendimentos recentes. <b>Sem</b> dados bancários, conteúdo judicial, comportamento ou narrativas. Marcado “confidencial — uso em saúde”.${S.offline?" A versão offline indica a última sincronização.":""}</div>
      <button class="btn block" style="margin-top:14px" onclick="A.closeSheet();toast('PDF gerado — finalidade e download registrados em auditoria')">Gerar PDF</button>`;
    render();
  },

  testemunho(o){ S.passagem.testemunho=o; render(); },
  assinarPassagem(){ S.passagem.assinada=true; fila(); toast(S.offline?"Passagem assinada offline — provisória até consolidar no servidor":"Passagem assinada"); render(); },
  receber(){ S.recebimentoOk=true; toast("Recebimento confirmado individualmente"); render(); },

  fecharAta(pend){ S.ataFechada=true; S.ataPendencia=pend; toast(pend?"ATA fechada com pendência — sem assinatura falsa":"ATA fechada e consolidada"); render(); },
  aprovarSub(){ S.subPendente=false; toast("Substituto atribuído — aguardando ciência dele"); render(); },
  urgenteSheet(){
    S.sheet = `<h3>Atividade urgente e pontual</h3>
      <label class="f">O quê</label><input type="text" id="urg-t" placeholder="Ex.: levar Igor ao retorno da UPA às 16h">
      <label class="f">Motivo <small>— obrigatório, fica no histórico</small></label>
      <textarea id="urg-m" placeholder="Por que esta atividade não estava no planejamento…"></textarea>
      <button class="btn block" style="margin-top:12px" onclick="A.urgenteOk()">Criar com autoria e histórico</button>`;
    render();
  },
  urgenteOk(){
    const el = document.getElementById("urg-t");
    S.urgente.push((el && el.value) || "Atividade urgente do plantão");
    S.sheet=null; toast("Criada — não altera o planejamento regular"); render();
  },

  visitaSheet(cod){
    S.sheet = `<h3>Registro · ${cod}</h3>
      <label class="f">Tipo</label>
      <div class="opts">${[["Chamado por telefone","c-info"],["Visita à casa","c-ok"]].map(([o,c])=>`
        <button class="opt ${c}" onclick="A.visitaOk('${cod}','${o}')">${o}</button>`).join("")}</div>
      <label class="f">Motivo</label>
      <select class="field"><option>Saúde</option><option>Medicamento</option><option>Saída não autorizada</option><option>Falta de pessoal</option><option>Apoio operacional</option><option>Outro</option></select>
      <div class="row" style="margin-top:6px">
        <div class="grow"><label class="f">Chegada</label><input type="text" value="02:20"></div>
        <div class="grow"><label class="f">Saída</label><input type="text" value="03:05"></div>
      </div>
      <label class="f">Providência e pendência deixada</label>
      <textarea placeholder="O que foi feito e o que fica para a casa, técnica ou coordenação…"></textarea>`;
    render();
  },
  visitaOk(cod,tipo){
    S.noturno.visitas[cod]={tipo, motivo:"Saúde", chegada:"02:20", saida:"03:05"};
    S.sheet=null; toast(`${tipo} registrado para ${cod}`); render();
  },
  fecharAtaGeral(){ S.noturno.ataGeral=true; toast("ATA Geral Noturna fechada — situação das 8 casas registrada"); render(); },

  assinarTriagem(id){ TRIAGEM.find(x=>x.id===id).assinada=true; toast("Evolução triada e assinada — a grade de medicamentos já pode ser atualizada"); render(); },

  gestorAbrir(cod){ S.gestorCasa=cod; toast("Abertura da unidade registrada em auditoria"); render(); },
  gestorFechar(){ S.gestorCasa=null; render(); },
  reauthOk(){ S.reauth=true; toast("Identidade confirmada — cada visualização gera log específico"); render(); },
};
window.A = A;

function render(){
  // A porta de entrada vem primeiro, como no sistema real.
  if(!S.logado){ vLogin(); return; }
  ({educador:vEducador, lider:vLider, noturno:vNoturno, enfermagem:vEnfermagem,
    tecnica:vTecnica, coordenador:vCoordenador, gestor:vGestor}[S.role])();
  // Primeiro acesso: sugestão de senha pessoal, logo depois de entrar.
  if(S.sugereSenha && !S.sheet) setTimeout(()=>A.senhaModal(true), 350);
}
render();
</script>
