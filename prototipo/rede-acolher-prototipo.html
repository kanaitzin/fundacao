/* ===== Tokens ===== */

  --restr:#6B4E8E; --restr-bg:#ECE5F4;

    --amber:#D9A55A; --amber-bg:#3A2F1B; --crit:#D97B74; --crit-bg:#3D2422;

  }
}
:root[data-theme="dark"]{

  --amber:#D9A55A; --amber-bg:#3A2F1B; --crit:#D97B74; --crit-bg:#3D2422;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

h1,h2,h3,h4{font-family:"Sora","Atkinson Hyperlegible",system-ui,sans-serif;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== Barra de validação ===== */
.valbar{
  position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:var(--shadow);
}
.valbar .brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.valbar .brand b{font-family:"Sora",sans-serif;font-size:17px;color:var(--brand)}
.logochip{background:#FFFFFF;border-radius:8px;padding:2px 6px;display:inline-flex;align-items:center;border:1px solid var(--line)}
.logochip img{height:28px;width:auto;display:block}
.valbar .brand span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.valbar select{
  background:var(--raised);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;
  padding:7px 10px;font:inherit;font-size:14px;max-width:210px;
}
.chipbtn{
  border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);
  border-radius:999px;padding:7px 13px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;
}
.chipbtn[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);font-weight:700}
.offbanner{
  background:var(--amber-bg);color:var(--amber);border-bottom:1px solid var(--amber);
  padding:8px 14px;font-size:14px;text-align:center;font-weight:700;
}
.offbanner small{display:block;font-weight:400;font-size:12.5px}

/* ===== Casca do app ===== */
.phone{max-width:460px;margin:0 auto;min-height:calc(100dvh - 120px);display:flex;flex-direction:column}
.apphead{padding:18px 16px 10px}
.apphead .ctx{font-size:12.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.apphead h1{font-size:21px}
.apphead .sub{font-size:14px;color:var(--muted);margin-top:3px}
main.screen{flex:1;padding:4px 14px 96px}
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);display:flex;justify-content:center;
}
.tabbar .inner{display:flex;width:100%;max-width:460px}
.tabbar button{
  flex:1;background:none;border:none;color:var(--muted);padding:9px 2px 12px;font-size:11.5px;
  display:flex;flex-direction:column;gap:3px;align-items:center;border-top:3px solid transparent;
}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button[aria-current="true"]{color:var(--primary);font-weight:700;border-top-color:var(--primary)}

/* ===== Componentes ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2.5px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--pos-bg);color:var(--pos)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neutral{background:var(--primary-soft);color:var(--primary-soft-ink)}
.pill.restr{background:var(--restr-bg);color:var(--restr)}
.btn{
  border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14.5px;
  background:var(--primary);color:var(--primary-ink);
}
.btn.sec{background:var(--primary-soft);color:var(--primary-soft-ink)}
.btn.ghost{background:none;border:1px solid var(--line-strong);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--crit-bg);color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mutetxt{color:var(--muted);font-size:13px}
.divider{border:none;border-top:1px solid var(--line);margin:12px 0}
.notice{border-radius:12px;padding:10px 13px;font-size:13.5px}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.warn{background:var(--amber-bg);color:var(--amber)}
.notice.restr{background:var(--restr-bg);color:var(--restr)}
.section-title{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-family:"Sora",sans-serif}
input[type=text],input[type=password],textarea,select.field{
  width:100%;background:var(--raised);color:var(--ink);border:1px solid var(--line-strong);

}
textarea{min-height:74px;resize:vertical}
label.f{display:block;font-size:13.5px;font-weight:700;margin:12px 0 5px}
label.f small{font-weight:400;color:var(--muted)}

/* ===== Linha do tempo ===== */
.tl-item{display:flex;gap:12px}
.tl-time{
  width:52px;flex:none;text-align:right;font-family:"Sora",sans-serif;font-weight:700;font-size:14px;
  font-variant-numeric:tabular-nums;color:var(--primary);padding-top:13px;
}
.tl-item.past .tl-time{color:var(--muted)}
.tl-rail{width:12px;flex:none;display:flex;flex-direction:column;align-items:center}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--line-strong);margin-top:18px;flex:none}
.tl-item.now .tl-dot{background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.tl-item.crit .tl-dot{background:var(--crit)}
.tl-line{width:2px;flex:1;background:var(--line)}
.tl-card{flex:1;margin-bottom:10px}
.tl-card .who{font-weight:700;font-size:15px}
.tl-card .what{font-size:14.5px;margin-top:1px}

.seg button{flex:1;border:none;background:none;color:var(--muted);border-radius:8px;padding:7px 4px;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}

/* ===== Visão dos 20 ===== */
.kids{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kidcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px;box-shadow:var(--shadow);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.kidcard .nm{font-weight:700;font-size:14.5px;line-height:1.2}
.kidcard .age{color:var(--muted);font-size:12px}
.kidcard .st{font-size:12.5px}

/* ===== Chamada ===== */
.callrow{display:flex;flex-direction:column;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.callrow .opts{display:flex;flex-wrap:wrap;gap:6px}
.optchip{border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px}
.optchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.optchip.exc[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#fff}
.progressbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progressbar>div{height:100%;background:var(--primary);border-radius:99px}

/* ===== Modal / sheet ===== */
.overlay{position:fixed;inset:0;background:rgba(10,15,13,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:460px;max-height:86dvh;overflow:auto;padding:18px 16px 22px}
.sheet h3{font-size:17px;margin-bottom:4px}
.sheet .handle{width:44px;height:5px;border-radius:99px;background:var(--line-strong);margin:0 auto 14px}

/* ===== Grades / tabelas ===== */
.med-dose{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.med-dose .hr{font-family:"Sora",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;width:50px;color:var(--primary)}
.houses{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.housecard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:var(--shadow);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:6px}
.housecard .cd{font-family:"Sora",sans-serif;font-weight:700;font-size:15px}
.sidebyside{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:420px){.sidebyside{grid-template-columns:1fr}}
.statement{background:var(--restr-bg);border-radius:12px;padding:11px;font-size:13.5px;color:var(--ink)}
.statement .au{font-weight:700;font-size:12.5px;color:var(--restr);margin-bottom:4px}

/* validação flutuante */
.valfab{
  position:fixed;right:14px;bottom:76px;z-index:45;border:none;border-radius:999px;
  background:var(--info-bg);color:var(--info);font-weight:700;font-size:13px;padding:9px 14px;box-shadow:var(--shadow);
}
.checklist li{margin-bottom:8px;font-size:14px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:95;background:var(--ink);color:var(--ground);
  border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;box-shadow:var(--shadow);max-width:90vw;text-align:center;
}
.audit{font-size:11.5px;color:var(--muted);margin-top:6px}
</style>

function tabbar(items){
  return `<nav class="tabbar" aria-label="Navegação principal"><div class="inner">${
    items.map(t=>`<button aria-current="${S.tab===t.id}" onclick="A.setTab('${t.id}')"><span class="ic" aria-hidden="true">${t.ic}</span>${t.label}</button>`).join("")
  }</div></nav>`;
}
function apphead(ctx, titulo, sub){
  return `<header class="apphead"><div class="ctx">${ctx}</div><h1>${titulo}</h1>${sub?`<div class="sub">${sub}</div>`:""}</header>`;
}

/* ---------- EDUCADOR ---------- */
function vEducador(){
  const tabs = tabbar([
    {id:"tl", ic:"🕰️", label:"Linha do tempo"},
    {id:"kids", ic:"👥", label:"Os 20"},
    {id:"chamada", ic:"✅", label:"Chamada"},
    {id:"meds", ic:"💊", label:"Medicamentos"},
    {id:"passagem", ic:"🔁", label:"Passagem"},
  ]);
  let inner="";
  if(S.kidView){ inner = vPerfil(S.kidView); }
  else if(S.tab==="tl") inner = vTimeline();
  else if(S.tab==="kids") inner = vKids();
  else if(S.tab==="chamada") inner = vChamada();
  else if(S.tab==="meds") inner = vMedsEducador();
  else if(S.tab==="passagem") inner = vPassagem();
  const head = apphead("Casa 03 · plantão diurno 07h–19h", S.kidView? "Perfil do Acolhido" : {tl:"Linha do tempo",kids:"Painel da casa — os 20",chamada:"Chamada coletiva",meds:"Medicamentos de hoje",passagem:"Minha passagem de plantão"}[S.tab], HOJE);
  shell(inner, tabs, head);
}
function vTimeline(){
  const seg = `<div class="seg" role="group" aria-label="Modo de visão">
    <button aria-pressed="${S.tlMode==='casa'}" onclick="A.tlMode('casa')">Casa — todos</button>
    <button aria-pressed="${S.tlMode==='minhas'}" onclick="A.tlMode('minhas')">Minhas responsabilidades</button>
  </div>`;
  const evs = EVENTOS.filter(e => S.tlMode==="casa" ? true : (e.resp||e.precisaCiencia||e.tipo==="med"));
  const list = evs.map((e,i)=>{
    const past = /Concluída|Administrado/.test(e.estado);
    const cls = `tl-item ${past?"past":""} ${e.destaque?"now":""} ${e.crit?"crit":""}`;
    const who = e.kidId ? `<span class="who">${kid(e.kidId).social}, ${kid(e.kidId).idade}</span> · ` : `<span class="who">Coletiva</span> · `;
    const actions = [];
    if(e.precisaCiencia && !e.ciencia) actions.push(`<button class="btn small" onclick="A.ciencia('${e.id}')">Estou ciente</button>`);
    if(e.ciencia && !/Concluída|Em andamento/.test(e.estado)) actions.push(`<button class="btn small sec" onclick="A.concluir('${e.id}')">Concluir</button>`);
    if(!/Concluída|Administrado/.test(e.estado)) actions.push(`<button class="btn small ghost" onclick="A.excecao('${e.id}')">Exceção…</button>`);
    if(e.chamada) actions.push(`<button class="btn small" onclick="A.setTab('chamada')">Abrir chamada</button>`);
    if(e.tipo==="med" && /Aguardando/.test(e.estado)) actions.push(`<button class="btn small" onclick="A.medSheet('m4')">Confirmar dose</button>`);
    return `<div class="${cls}">
      <div class="tl-time">${e.hora}</div>
      <div class="tl-rail"><div class="tl-dot"></div>${i<evs.length-1?'<div class="tl-line"></div>':""}</div>
      <div class="tl-card"><div class="card">
        <div class="row"><span aria-hidden="true">${IC[e.tipo]||"📌"}</span><div class="grow">${who}<span class="what">${e.titulo}</span></div></div>
        <div class="row" style="margin-top:7px">${pillEstado(e.estado)} ${e.resp?`<span class="mutetxt">${e.resp}</span>`:""}</div>
        ${e.nota?`<div class="mutetxt" style="margin-top:5px">${e.nota}</div>`:""}
        ${e.ciencia?`<div class="audit">Ciência registrada · você · 08:12 ${S.offline?"· offline":""}</div>`:""}
        ${actions.length?`<div class="row" style="margin-top:9px">${actions.join("")}</div>`:""}
      </div></div>
    </div>`;
  }).join("");
  return `${seg}<div class="notice info" style="margin-bottom:10px">Tarefas individuais aparecem sempre na visão da casa — nada fica oculto. Toque no nome para abrir o perfil.</div>${list}`;
}
function vKids(){
  const cards = KIDS.map(k=>{
    const med = MEDS.find(m=>m.kidId===k.id && /Aguardando|Agendado/.test(m.estado));
    const ev = EVENTOS.find(e=>e.kidId===k.id && !/Concluída|Administrado/.test(e.estado));
    return `<button class="kidcard" onclick="A.openKid(${k.id})">
      <div><span class="nm">${k.social}</span> <span class="age">${k.idade} anos</span></div>
      ${k.alergia?`<span class="pill crit">⚠ ${k.alergia}</span>`:""}
      ${k.restr&&!k.alergia?`<span class="pill warn">${k.restr.split("—")[0]}</span>`:""}
      ${med?`<span class="pill warn">💊 ${med.hora}</span>`:""}
      ${ev?`<span class="st mutetxt">${ev.hora} · ${ev.titulo.split("—")[0]}</span>`:`<span class="st mutetxt">Sem pendência agora</span>`}
    </button>`;
  }).join("");
  return `<div class="notice info" style="margin-bottom:10px">Situação atual de todos os acolhidos ativos, sem ranking e sem pontuação. Ordem alfabética.</div><div class="kids">${cards}</div>`;
}
function vPerfil(id){
  const k = kid(id);
  const meds = MEDS.filter(m=>m.kidId===id);
  return `
  <button class="btn ghost small" onclick="A.closeKid()">← Voltar</button>
  <div class="card" style="margin-top:10px">
    <h2 style="font-size:19px">${k.social} <span class="mutetxt" style="font-weight:400">· ${k.idade} anos</span></h2>
    <div class="mutetxt">Nome civil: ${k.nome} · CPF ***.***.***-** · Casa 03 · episódio atual desde mar/2026</div>
    <div class="row" style="margin-top:8px">
      ${k.alergia?`<span class="pill crit">⚠ Alergia: ${k.alergia}</span>`:""}
      ${k.restr?`<span class="pill warn">${k.restr}</span>`:""}
    </div>
  </div>
  <div class="section-title">Rotina e próximas atividades</div>
  <div class="card stack">
    ${EVENTOS.filter(e=>e.coletivo||e.kidId===id).slice(0,5).map(e=>`<div class="row"><b style="font-variant-numeric:tabular-nums">${e.hora}</b><div class="grow">${e.titulo}</div>${pillEstado(e.estado)}</div>`).join("")}
  </div>
  <div class="section-title">Medicamentos</div>
  <div class="card">${meds.length? meds.map(m=>`<div class="med-dose"><span class="hr">${m.hora}</span><div class="grow"><b>${m.nome}</b> ${m.dose} · ${m.via}</div>${pillEstado(m.estado)}</div>`).join("") : `<span class="mutetxt">Sem medicamento previsto. Fonte oficial: módulo de medicamentos, assinado pela Enfermagem.</span>`}</div>
  <div class="section-title">Observações operacionais — últimos plantões</div>
  <div class="card stack">
    <div><b>Ontem · noturno</b><div class="mutetxt">Dormiu no horário. Sem intercorrências.</div></div>
    <div><b>Ontem · diurno</b><div class="mutetxt">Participou do futebol no pátio. Almoço normal.</div></div>
  </div>
  <div class="section-title">Escola</div>
  <div class="card">${k.escola||"—"}</div>
  <div class="notice restr" style="margin-top:14px">Seções restritas ao seu papel: Família/Rede/Judiciário, PIA, Benefícios/Dados bancários e narrativas pessoais de outros educadores <b>não são exibidas</b> para educadores. Dados estruturais só são editados pela equipe técnica/coordenação.</div>
  <div class="row" style="margin-top:10px"><button class="btn sec" onclick="A.resumoSaude('${k.social}')">📄 Resumo de Saúde (PDF)</button></div>`;
}
function vChamada(){
  const OPTS = ["Normal","Parcial","Recusou","Ausente/atividade externa","Dieta adaptada","Não aplicável","Outro…"];
  const done = Object.keys(S.chamada).length;
  if(!S.chamadaAberta){
    return `<div class="card stack">
      <h3>Almoço · 12:00</h3>
      <p class="mutetxt" style="margin:0">Uma chamada confere todos os acolhidos ativos numa operação. Cada seleção gera registro individual no perfil. Meta operacional: concluir em menos de 2 minutos.</p>
      <button class="btn" onclick="A.abrirChamada()">Iniciar chamada do almoço</button>
    </div>
    <div class="section-title">Chamadas do dia</div>
    <div class="card stack">

      <div class="card row"><div class="grow"><b>Sincronizações</b><div class="mutetxt">1 conflito offline aguardando a equipe técnica</div></div>${pillEstado("Atenção")}</div>
      <div class="card row"><div class="grow"><b>ATAs da casa</b><div class="mutetxt">Diurna de ontem fechada com pendência (adendo aberto)</div></div>${pillEstado("Com pendência")}</div>
    </div>`;
  }
  shell(inner, tabs, apphead("Coordenação · Casa 03 · sem limite de horário", {casa:"Controle da casa",aprova:"Aprovações",banco:"Benefícios e dados bancários"}[S.tab]||"Casa", HOJE));
}

/* ---------- GESTOR ---------- */
function vGestor(){
  const tabs = tabbar([{id:"casas", ic:"🏢", label:"As 8 unidades"}]);
  let inner="";
  if(S.gestorCasa){
    const c = CASAS.find(x=>x.cod===S.gestorCasa);
    inner = `<button class="btn ghost small" onclick="A.gestorFechar()">← Todas as unidades</button>
    <div class="card stack" style="margin-top:10px">
      <h3>${c.cod} · ${c.nome}</h3>
      <div class="row"><span class="pill neutral">20 acolhidos ativos</span><span class="pill info">1 transferência pendente</span><span class="pill warn">2 alertas de saúde</span></div>
      <hr class="divider">
      <div class="row"><span class="grow">Entradas / saídas / retornos (30 dias)</span><b style="font-variant-numeric:tabular-nums">2 · 1 · 1</b></div>
      <div class="row"><span class="grow">ATAs diurnas / noturnas confirmadas</span><b>ok · ok</b></div>
      <div class="row"><span class="grow">Triagens de Enfermagem pendentes</span><b>2</b></div>
      <div class="row"><span class="grow">Falhas de sincronização</span><b>1 em análise</b></div>
      <hr class="divider">
      <p class="mutetxt" style="margin:0">Acesso institucional completo a observações diárias e relatórios. Narrativas pessoais independentes exigem apuração formal: finalidade, justificativa, reautenticação e auditoria destacada.</p>
      <button class="btn ghost small" onclick="toast('Fluxo excepcional: exige finalidade + justificativa + senha; o acesso fica destacado na auditoria.')">Acesso excepcional a narrativa…</button>
    </div>`;
  } else {
    const cards = CASAS.map(c=>`<button class="housecard" onclick="A.gestorAbrir('${c.cod}')">
      <span class="cd">${c.cod}</span>
      <span class="mutetxt" style="font-size:12px">${c.nome}</span>
      <span class="pill neutral">${18+((c.cod.length+c.cod.charCodeAt(1))%4)} acolhidos</span>
      ${c.cod==="AI3"?'<span class="pill info">piloto</span>':""}
    </button>`).join("");
    inner = `<div class="notice info" style="margin-bottom:10px">Oito unidades, sem ranking e sem comparação de “melhor/pior”. Abre-se uma casa por vez.</div>
    <div class="houses">${cards}</div>`;
  }
  shell(inner, tabs, apphead("Gestor Geral · escopo institucional", S.gestorCasa?`Unidade ${S.gestorCasa}`:"Visão institucional", HOJE));
}

/* ---------- Notas de validação por tela ---------- */
function valNotesContent(){
  const per = {
    educador_tl:["A ordem e os tipos de evento correspondem ao dia real da casa?","O destaque de itens críticos está claro sem esconder os demais?","Faltam tipos de evento (visita recebida, ligação, videochamada)?"],
    educador_kids:["Estes são os dados certos para o painel dos 20?","O que o educador mais precisa ver primeiro em cada card?"],
    educador_chamada:["Dá para concluir a chamada do almoço em menos de 2 minutos?","Os estados de refeição cobrem a realidade? Falta algum?","O pré-marcar “Normal” e revisar um a um é aceitável ou arriscado?"],
    educador_meds:["Os 4 alertas (−30/−15/0/+30) fazem sentido na rotina?","O bloqueio de confirmação offline fora do aparelho institucional é operável?"],
    educador_passagem:["Os campos cobrem a passagem real?","A separação entre itens visíveis e relato restrito está clara?","As 7 opções de testemunho são suficientes?"],
    lider:["O líder precisa de mais alguma visão além de alertas, substituições e urgências?","O fluxo de fechar ATA com pendência reflete a prática?"],
    noturno:["A visão mínima das 8 casas basta para o plantão noturno?","Os campos de chamado/visita (motivo, chegada, saída, providência) estão completos?"],
    enfermagem:["A ordem casa → acolhidos funciona para a rotina da Enfermagem?","O fluxo de triagem das Evoluções está correto?","Que filtros faltam (receita vencendo, exame, retorno, internação)?"],
    tecnica:["As inconsistências sinalizadas são as que ocorrem de verdade?","A visão lado a lado das narrativas atende à análise técnica?"],
    coordenador:["As aprovações listadas são as críticas do dia a dia?","A reautenticação para dados bancários está no nível certo de fricção?"],
    gestor:["Os cards por unidade mostram o que o gestor precisa sem criar ranking?","O fluxo de acesso excepcional está suficientemente protegido?"],
  };
  const key = S.role==="educador" ? `educador_${S.kidView?"kids":S.tab}` : S.role;
  const list = per[key]||per[S.role]||["Esta tela representa bem o trabalho real?"];
  return `<h3>O que validar com a equipe nesta tela</h3>
  <ul class="checklist">${list.map(i=>`<li>${i}</li>`).join("")}</ul>
  <p class="mutetxt">Este protótipo é a Fase 0 do projeto: validar fluxo e linguagem com quem vive o plantão, antes de construir o sistema real. Nada aqui é definitivo.</p>
  <button class="btn sec" onclick="A.closeSheet()">Fechar</button>`;
}

/* ---------- Ações ---------- */
const A = {
  setRole(r){ S.role=r; S.kidView=null; S.sheet=null; S.gestorCasa=null;
    S.tab = {educador:"tl",lider:"painel",noturno:"casas",enfermagem:"painel",tecnica:"painel",coordenador:"casa",gestor:"casas"}[r]; render(); },
  setTab(t){ S.tab=t; S.kidView=null; render(); },
  toggleOffline(){ S.offline=!S.offline; if(!S.offline && S.filaOffline>0){ toast(`Reconectado — ${S.filaOffline} registro(s) sincronizados com horário real preservado`); S.filaOffline=0;} render(); },
  toggleTheme(){ const r=document.documentElement; const cur=r.getAttribute("data-theme");
    const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
    const next = cur==="dark" ? "light" : cur==="light" ? "dark" : (sysDark?"light":"dark");
    r.setAttribute("data-theme", next); },
  tlMode(m){ S.tlMode=m; render(); },
  openKid(id){ S.kidView=id; render(); },
  closeKid(){ S.kidView=null; render(); },
  valNotes(){ S.sheet = valNotesContent(); render(); },
  closeSheet(){ S.sheet=null; render(); },

  ciencia(id){ const e=EVENTOS.find(x=>x.id===id); e.ciencia=true; e.estado="Ciente"; offlineQueue(); toast("Ciência registrada — ciência não é conclusão"); },
  concluir(id){ const e=EVENTOS.find(x=>x.id===id); e.estado="Concluída no horário"; offlineQueue(); toast("Atividade concluída"); },
  excecao(id){
    const e=EVENTOS.find(x=>x.id===id);
    S.sheet = `<h3>Registrar exceção</h3><p class="mutetxt">${e.titulo}</p>
      ${["Reagendada","Cancelada externamente","Recusada pelo acolhido","Não realizada — saúde","Não realizada — ausência profissional","Não realizada — transporte","Não realizada — decisão institucional","Não aplicável"].map(o=>`<button class="optchip exc" style="margin:3px" onclick="A.excecaoOk('${id}','${o}')">${o}</button>`).join("")}
      <label class="f">Justificativa objetiva <small>(fato e contexto, sem rótulo)</small></label>
      <textarea placeholder="Descreva o fato concreto…"></textarea>`;
    render();
  },
  excecaoOk(id,estado){ const e=EVENTOS.find(x=>x.id===id); e.estado=estado; S.sheet=null; offlineQueue(); toast("Exceção registrada com justificativa"); },

  abrirChamada(){ S.chamadaAberta=true; render(); },
  marcar(id,op){ S.chamada[id]=op; offlineQueue(); render(); },
  marcarTodosNormais(){ KIDS.forEach(k=>{ if(!S.chamada[k.id]) S.chamada[k.id]="Normal"; }); toast("Pré-marcado — revise um a um antes de confirmar"); render(); },
  fecharChamada(){ S.chamadaAberta=false; S.chamadaConfirmada=true;
    const e=EVENTOS.find(x=>x.id==="e8"); e.estado="Concluída no horário"; e.chamada=false;
    const exc = Object.values(S.chamada).filter(v=>v!=="Normal").length;
    e.nota = `Chamada registrada · ${20-exc} normais, ${exc} com anotação`;
    toast("Chamada confirmada — 20 registros individuais criados"); render(); },

  medSheet(id){
    const m = MEDS.find(x=>x.id===id); const k = kid(m.kidId);
    const bloqueado = S.offline && !S.instDevice;
    S.sheet = `<h3>Confirmar dose · ${k.social}</h3>
      <p class="mutetxt">${m.nome} ${m.dose} · ${m.via} · previsto ${m.hora}</p>
      ${k.alergia?`<div class="notice warn">⚠ Alergia registrada: ${k.alergia}</div>`:""}
      ${S.offline?`<label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${S.instDevice?"checked":""} onchange="A.instDev(this.checked,'${id}')" style="width:auto"> Este é o aparelho institucional designado da casa</label>`:""}
      ${bloqueado?`<div class="notice warn">Offline, somente o <b>aparelho institucional designado</b> confirma medicamento, para evitar duplicidade entre aparelhos desconectados. Celular pessoal pode consultar e registrar outras atividades.</div>`:`
      <label class="f">Quem administrou foi você?</label>
      <div class="notice info">A confirmação é individual e intransferível: só confirma quem efetivamente administrou.</div>
      ${["Administrado no horário","Administrado com atraso","Recusado","Indisponível","Acolhido ausente","Incidente"].map(o=>`<button class="optchip ${o.startsWith("Administrado")?"":"exc"}" style="margin:3px" onclick="A.medOk('${id}','${o}')">${o}</button>`).join("")}
      <label class="f">Observação <small>(obrigatória para recusa, atraso, omissão ou incidente)</small></label>
      <textarea placeholder="Ex.: recusou a primeira oferta; aceitou após conversa…"></textarea>`}`;
    render();
  },
  instDev(v,id){ S.instDevice=v; A.medSheet(id); },
  medOk(id,estado){
    const m = MEDS.find(x=>x.id===id); m.estado=estado; m.por="Você"; m.pendente=false;
    const e = EVENTOS.find(x=>x.tipo==="med" && x.kidId===m.kidId && x.hora===m.hora); if(e){e.estado=estado; e.crit=false;}
    S.sheet=null; offlineQueue();
    toast(estado.startsWith("Administrado") ? "Dose confirmada — horário real registrado" : `Registrado: ${estado} — Enfermagem, técnica e coordenação notificadas`);
  },
  resumoSaude(nome){
    S.sheet = `<h3>Resumo de Saúde · ${nome}</h3>
    <label class="f">Finalidade da emissão <small>(obrigatória e auditada)</small></label>
    <select class="field"><option>Consulta</option><option>Exame</option><option>Urgência/emergência</option><option>Internação</option><option>Transferência assistencial</option></select>
    <div class="notice warn" style="margin-top:10px">O PDF contém somente o necessário: identificação, alergias, restrições, condições relevantes, medicamentos ativos e atendimentos recentes. <b>Sem</b> dados bancários, conteúdo judicial, comportamento ou narrativas. Marcado “confidencial — uso em saúde”.${S.offline?" Versão offline indica data/hora da última sincronização.":""}</div>
    <button class="btn" style="margin-top:12px" onclick="A.closeSheet();toast('PDF gerado — geração, finalidade e download registrados em auditoria')">Gerar PDF</button>`;
    render();
  },

  testemunho(o){ S.passagem.testemunho=o; render(); },
  assinarPassagem(){ S.passagem.assinada=true; offlineQueue(); toast(S.offline?"Passagem assinada offline — provisória até consolidar no servidor":"Passagem assinada"); render(); },
  receber(){ S.recebimentoOk=true; toast("Recebimento confirmado individualmente"); render(); },

  fecharAta(pend){ S.ataFechada=true; S.ataPendencia=pend; toast(pend?"ATA fechada com pendência — sem assinatura falsa":"ATA fechada e consolidada"); render(); },
  aprovarSub(){ S.subPendente=false; toast("Substituto atribuído — aguardando ciência dele"); render(); },
  urgenteSheet(){
    S.sheet = `<h3>Atividade urgente e pontual</h3>
      <label class="f">O quê</label><input type="text" id="urg-t" placeholder="Ex.: levar Igor ao retorno da UPA às 16h">
      <label class="f">Motivo <small>(obrigatório — fica no histórico)</small></label><textarea id="urg-m" placeholder="Por que esta atividade não estava no planejamento…"></textarea>
      <button class="btn" style="margin-top:10px" onclick="A.urgenteOk()">Criar com autoria e histórico</button>`;
    render();
  },
  urgenteOk(){ const t=document.getElementById("urg-t").value||"Atividade urgente"; S.urgente.push(t); S.sheet=null; toast("Criada — não altera o planejamento regular"); render(); },

  visitaSheet(cod){
    S.sheet = `<h3>Registro · ${cod}</h3>
      <label class="f">Tipo</label>
      <div class="row">${["Chamado atendido por telefone","Visita à casa"].map(o=>`<button class="optchip" onclick="A.visitaOk('${cod}','${o}')">${o}</button>`).join("")}</div>
      <label class="f">Motivo</label><select class="field"><option>Saúde</option><option>Medicamento</option><option>Saída não autorizada</option><option>Falta de pessoal</option><option>Apoio operacional</option><option>Outro</option></select>
      <div class="row" style="margin-top:10px">
        <div class="grow"><label class="f" style="margin-top:0">Chegada</label><input type="text" value="02:20"></div>
        <div class="grow"><label class="f" style="margin-top:0">Saída</label><input type="text" value="03:05"></div>
      </div>
      <label class="f">Providência e pendência deixada</label><textarea placeholder="O que foi feito e o que fica para a casa/técnica/coordenação…"></textarea>`;
    render();
  },
  visitaOk(cod,tipo){ S.noturno.visitas[cod]={tipo, motivo:"Saúde", chegada:"02:20", saida:"03:05"}; S.sheet=null; toast(`${tipo} registrado para ${cod}`); render(); },
  fecharAtaGeral(){ S.noturno.ataGeral=true; toast("ATA Geral Noturna fechada — situação das 8 casas registrada"); render(); },

  assinarTriagem(id){ const t=TRIAGEM.find(x=>x.id===id); t.assinada=true; toast("Evolução triada e assinada — agora a grade de medicamentos pode ser atualizada"); render(); },

  gestorAbrir(cod){ S.gestorCasa=cod; toast("Abertura da unidade registrada em auditoria"); render(); },
  gestorFechar(){ S.gestorCasa=null; render(); },
  reauthOk(){ S.reauth=true; toast("Identidade confirmada — cada visualização gera log específico"); render(); },
};
window.A = A;

function render(){
  ({educador:vEducador, lider:vLider, noturno:vNoturno, enfermagem:vEnfermagem,
    tecnica:vTecnica, coordenador:vCoordenador, gestor:vGestor}[S.role])();
}
render();
</script>
