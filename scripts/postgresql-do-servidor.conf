# O BANCO DO SERVIDOR DO PÃO (fase 220): nada do que foi salvo se perde.
#
# Acrescente ao postgresql.conf do servidor (ou ponha num arquivo em conf.d/)
# e reinicie o PostgreSQL. Os caminhos supõem a instalação em
# /opt/rede-acolher e o segundo disco montado em /var/lib/rede-acolher;
# ajuste se forem outros.

# Toda gravação confirmada ao usuário já está no disco (o padrão; não mude).
fsync = on
synchronous_commit = on
full_page_writes = on

# O arquivo contínuo: cada trecho do diário do banco vai para o segundo disco.
wal_level = replica
archive_mode = on
archive_command = 'ARQUIVO_WAL_DIR=/var/lib/rede-acolher/wal /opt/rede-acolher/scripts/arquivar-wal.sh %p %f'
# Mesmo com pouca gravação, um trecho fecha a cada minuto: no pior caso, o que
# está no disco principal e ainda não foi para o segundo é um minuto.
archive_timeout = 60

# A consulta lenta aparece no log, com o tempo e sem os valores.
log_min_duration_statement = 1000
log_parameter_max_length = 0

# Ao CRIAR o banco no servidor, use as somas de página, que fazem o Postgres
# recusar um bloco corrompido pelo disco em vez de devolver dado errado:
#   initdb --data-checksums -D <pasta>
# Num banco já criado: pg_checksums --enable -D <pasta>, com o banco parado.
